<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirection — Samsung Galaxy S24 Ultra</title>
  <!-- Ancienne adresse : la fiche est maintenant générée dynamiquement -->
  <meta http-equiv="refresh" content="0; url=produit.html?p=samsung">
  <link rel="icon" href="images/logo.png" type="image/png">
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;
      background:#070b14;color:#e9effc;font-family:'Segoe UI',Tahoma,sans-serif;text-align:center}
    a{color:#4cc2ff}
    .box{padding:40px}
    .spin{width:46px;height:46px;border:3px solid rgba(76,194,255,.25);border-top-color:#4cc2ff;
      border-radius:50%;margin:0 auto 22px;animation:sp .8s linear infinite}
    @keyframes sp{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div class="box">
    <div class="spin"></div>
    <p>Ouverture de la fiche <b>Samsung Galaxy S24 Ultra</b>…</p>
    <p><a href="produit.html?p=samsung">Cliquez ici si la page ne se charge pas</a></p>
  </div>
</body>
</html>
